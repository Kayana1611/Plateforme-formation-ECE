<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECE Formation — V2.4</title>
<style>
:root{--brown:#5a3426;--orange:#e87522;--yellow:#f3c94f;--green:#2e9f68;--cyan:#27b8c7;--magenta:#b84d9a;--navy:#5a3426;--purple:#b84d9a;--red:#dc4c64;--bg:#fbf8f5;--text:#332720;--muted:#766b64;--border:#eadfd8}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--brown),var(--magenta))}
.logo-login{display:block;width:150px;height:auto;margin:0 auto 12px;border-radius:12px}.logo-side{display:block;width:130px;height:58px;object-fit:contain;object-position:left center;margin:0 0 14px}.loginbox{width:min(440px,92vw);background:#fff;border-radius:20px;padding:32px;box-shadow:0 20px 60px #0004}.loginbox h1{margin:0 0 8px}.input{width:100%;padding:12px;border:1px solid var(--border);border-radius:9px;margin:6px 0 14px}
.app{display:flex;min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:245px;background:#f4eee8;color:var(--brown);padding:20px 13px;overflow:auto}.brand{font-weight:800;font-size:21px;padding:0 12px 20px}.brand span{color:#a89eff}.nav button{width:100%;background:transparent;border:0;color:#6b5a50;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0}.nav button:hover,.nav button.active{background:#f0d8c7;color:var(--brown)}
.main{margin-left:245px;flex:1}.top{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:0 28px}.avatar{width:38px;height:38px;border-radius:50%;background:#fff0df;color:var(--brown);display:grid;place-items:center;font-weight:800}.content{max-width:1280px;margin:auto;padding:28px}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:19px;box-shadow:0 4px 16px #28234408}.hero{background:linear-gradient(135deg,var(--brown),var(--magenta));color:#fff;border-radius:18px;padding:24px;margin-bottom:18px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{margin:0 0 7px}.muted{color:var(--muted);font-size:14px}.hero .muted{color:#ddd9f4}.btn{border:0;border-radius:9px;padding:10px 15px;background:var(--orange);color:#fff;font-weight:700}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.light{background:#fff;color:var(--navy)}.btn.secondary{background:#f8e5ee;color:var(--magenta)}.btn:disabled{opacity:.45;cursor:not-allowed}.kpi{font-size:27px;font-weight:800;margin:6px 0}.progress{height:9px;background:#ecebf2;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--orange),var(--yellow))}.bar.green{background:var(--green)}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700}.ok{background:#e0f7ef;color:#168763}.doing{background:#eeeaff;color:#5548d3}.lock{background:#eeeef3;color:#777}.warn{background:#fff2d5;color:#a66a00}.bad{background:#ffe5e9;color:#b22e45}.row{display:flex;align-items:center;gap:13px}.grow{flex:1}.list{display:grid;gap:10px}.listrow{background:#fff;border:1px solid var(--border);border-radius:13px;padding:14px;display:flex;align-items:center;gap:13px}.num{width:40px;height:40px;border-radius:11px;background:#fff1d9;color:var(--brown);display:grid;place-items:center;font-weight:800}.hidden{display:none}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}.modal.hidden{display:none}.modal{position:fixed;inset:0;background:#1118;display:grid;place-items:center;padding:20px;z-index:5}.modalbox{background:#fff;border-radius:16px;padding:24px;width:min(700px,95vw);max-height:90vh;overflow:auto}.option{border:1px solid var(--border);padding:12px;border-radius:9px;margin:8px 0}.option.selected{border-color:var(--purple);background:#f2efff}.backnav{display:flex;gap:8px;align-items:center;margin-bottom:14px}.backnav .btn{background:#fff;color:var(--brown);border:1px solid var(--border)}
.celebration{position:relative;overflow:hidden;border:2px solid var(--yellow);background:linear-gradient(135deg,#fffaf0,#fff)}.cup{font-size:76px;display:inline-block;animation:cupBounce 1s ease-in-out infinite alternate}.fireworks{position:absolute;inset:0;pointer-events:none;overflow:hidden}.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--orange);animation:burst 1.8s ease-out infinite}.spark:nth-child(1){left:10%;top:20%;animation-delay:.1s}.spark:nth-child(2){left:25%;top:8%;animation-delay:.35s}.spark:nth-child(3){left:45%;top:15%;animation-delay:.2s}.spark:nth-child(4){left:65%;top:10%;animation-delay:.5s}.spark:nth-child(5){left:82%;top:25%;animation-delay:.15s}.spark:nth-child(6){left:92%;top:8%;animation-delay:.4s}.spark:nth-child(7){left:18%;top:55%;animation-delay:.6s}.spark:nth-child(8){left:78%;top:60%;animation-delay:.3s}@keyframes cupBounce{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-12px) rotate(3deg)}}@keyframes burst{0%{transform:translate(0,0) scale(.2);opacity:0}25%{opacity:1}100%{transform:translate(25px,45px) scale(1.1);opacity:0}}
.toast{position:fixed;right:22px;bottom:22px;background:var(--brown);color:#fff;padding:12px 16px;border-radius:9px;display:none;z-index:9}
@media(max-width:900px){.side{width:70px}.brand{font-size:0}.brand:after{content:"ECE";font-size:18px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:18px}.main{margin-left:70px}.g4,.g3{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.side{display:none}.main{margin-left:0}.content{padding:16px}.g4,.g3{grid-template-columns:1fr}.hero{display:block}.top{padding:0 15px}}
</style>
</head>

}

 }

function ensureExercises(){
 const t=training();
 for(let i=1;i<=t.modules.length;i++){
   if(!db.exercises.some(e=>e.userId===session?.userId&&e.module===i&&(e.trainingName||"Word Débutant")===t.name)){
     const bank=t.name==="Word Débutant"?wordBeginnerExercises:(t.name==="Word Intermédiaire"?wordIntermediateExercises:(t.name==="Word Avancé"?wordAdvancedExercises:null)); const def=bank?.[i-1]||{title:t.modules[i-1][0],brief:"Mise en situation professionnelle à réaliser.",correction:"Corrigé pédagogique à consulter après validation du test."};
     db.exercises.push({id:Date.now()+i,userId:session.userId,trainingName:t.name,module:i,title:def.title,brief:def.brief,correction:def.correction,status:"locked",comment:"Débloqué après validation du test du module."});
   }
 }
}
function ensureState(){
 const u=currentUser();
 if(!u.trainingStates) u.trainingStates={};
 const t=training();
 const name=t.name;
 if(!u.trainingStates[name]) u.trainingStates[name]={};
 const state=u.trainingStates[name];
 if(!state.moduleState) state.moduleState={};
 t.modules.forEach((m,i)=>{
   const k=String(i+1);
   if(!state.moduleState[k]) state.moduleState[k]={course:false,exercise:false,test:false,unlocked:i===0};
   if(state.moduleState[k].unlocked===undefined) state.moduleState[k].unlocked=(i===0);
 });
 t.modules.forEach((m,i)=>{
   if(i>0 && state.moduleState[String(i)].test) state.moduleState[String(i+1)].unlocked=true;
 });
 ensureExercises();
 db.exercises.filter(e=>e.userId===session?.userId && (e.trainingName||"Word Débutant")===t.name).forEach(e=>{
   const st=state.moduleState[String(e.module)];
   if(st?.test && e.status==="locked") e.status="pending";
 });
 save();
}
function moduleIndex(){
 ensureState();
 const ms=training().modules;
 const u=currentUser();
 let i=ms.findIndex((m,idx)=>!trainingState().moduleState[String(idx+1)].test);
 return i<0?ms.length-1:i;
}
function moduleStatus(i){
 ensureState();
 const st=trainingState().moduleState[String(i+1)];
 if(st?.test) return 'ok';
 if(st?.unlocked) return 'doing';
 return 'lock';
}
function markStage(stage){
 ensureState();
 const n=window.currentModule||moduleIndex()+1;
 const st=trainingState().moduleState[String(n)];
 st[stage]=true;
 save(); render();
 toast(stage==='course'?'Cours consulté ✓':stage==='exercise'?'Exercice réalisé ✓':'Étape enregistrée ✓');
}
function progress(){
 ensureState();
 let m=training().modules, done=m.filter((x,i)=>trainingState().moduleState[String(i+1)]?.test).length;
 return Math.round(done/m.length*100)
}

function shuffleArray(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function startTest(n){

    toast("La banque de questions de ce niveau contient moins de 10 questions.");

  }
  const selected=shuffleArray(bank).slice(0,10);
  testQuestions=selected.map(q=>{
    const options=shuffleArray(q[1].map((text,index)=>({text,index})));

  });

  show('tests');
}

function parseResultDate(value){
 if(!value) return '—';
 if(value instanceof Date && !isNaN(value)) return value.toLocaleDateString('fr-FR');
 const raw=String(value).trim();
 // Ancien format enregistré par la plateforme : JJ/MM/AAAA
 const fr=raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
 if(fr){ const d=new Date(Number(fr[3]),Number(fr[2])-1,Number(fr[1])); return isNaN(d)?raw:d.toLocaleDateString('fr-FR'); }
 const d=new Date(raw);
 return isNaN(d)?raw:d.toLocaleDateString('fr-FR');
}

function openLearnerDatesAdmin(userId){ const u=db.users.find(x=>x.id===userId); if(!u||u.role!=="learner")return; normalizeLearner(u); const rows=(u.purchasedTrainings||[]).map(name=>{const a=ensureTrainingAccess(u,name),st=accessStatus(u,name);return `<div class="card" style="margin:10px 0"><div class="row" style="flex-wrap:wrap"><div class="grow"><b>${name}</b><div class="muted">Statut : <span class="badge ${st.className}">${st.label}</span></div></div><input class="input" id="adminStart_${u.id}_${encodeURIComponent(name)}" type="date" value="${a.startDate||''}" style="max-width:170px"><input class="input" id="adminEnd_${u.id}_${encodeURIComponent(name)}" type="date" value="${a.endDate||''}" style="max-width:170px"></div></div>`}).join(''); showModal(`<h2>📅 Dates d’accès — ${displayName(u)}</h2><p class="muted">Les dates sont gérées formation par formation.</p>${rows||'<p class="muted">Aucune formation attribuée.</p>'}<div style="margin-top:15px"><button class="btn" onclick="saveAllAdminDates(${u.id})">Enregistrer les dates</button> <button class="btn secondary" onclick="closeModal()">Fermer</button></div>`); }
function saveAllAdminDates(userId){ const u=db.users.find(x=>x.id===userId); if(!u)return; for(const name of (u.purchasedTrainings||[])){const key=encodeURIComponent(name), start=document.getElementById(`adminStart_${u.id}_${key}`)?.value||'', end=document.getElementById(`adminEnd_${u.id}_${key}`)?.value||''; if(!start||!end){toast(`Renseignez les dates de ${name}.`);return;} if(new Date(end)<new Date(start)){toast(`La date de fin de ${name} est invalide.`);return;} ensureTrainingAccess(u,name); u.trainingAccess[name]={startDate:start,endDate:end};} save(); closeModal(); render(); toast('Dates d’accès enregistrées ✓'); }

 else if(page==="payments") c.innerHTML=`${head("💳 Inscriptions & paiements","Gestion en ligne et manuelle")}<div class="grid g3"><div class="card"><h3>Inscriptions</h3><div class="kpi">18</div><p class="muted">12 actives · 6 terminées</p></div><div class="card"><h3>Paiements</h3><div class="kpi">4 860 €</div><p class="muted">Mois en cours</p></div><div class="card"><h3>À traiter</h3><div class="kpi">3</div><button class="btn secondary">Voir</button></div></div>`;
 else if(page==="stats") c.innerHTML=`${head("📊 Statistiques","Pilotage pédagogique et administratif")}<div class="grid g3"><div class="card"><h3>Taux de réussite</h3><div class="kpi">82%</div><div class="progress"><div class="bar green" style="width:82%"></div></div></div><div class="card"><h3>Progression moyenne</h3><div class="kpi">64%</div><div class="progress"><div class="bar" style="width:64%"></div></div></div><div class="card"><h3>Formations actives</h3><div class="kpi">18</div></div></div>`;
 else c.innerHTML=`${head("🔐 Sécurité","Contrôles et journalisation")}<div class="card"><p>✓ Contrôle des rôles côté application</p><p>✓ Sessions et déconnexion</p><p>✓ Historique des actions pédagogiques</p><p>○ 2FA administrateur — à connecter au backend</p><p>○ Journal serveur — à connecter au backend</p></div>`;
}

 else c.innerHTML=`${head("⬇️ Exports","Données de pilotage")}<div class="card"><p>Les exports CSV/Excel seront générés depuis les données de production.</p><button class="btn" onclick="downloadJSON()">Exporter les données de démo</button></div>`;

<!-- ECE Formation : Banque de questions administrable -->
<style>
.ece-qbank-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9998;display:none}
.ece-qbank{position:fixed;inset:4vh 5vw;background:#fff;border-radius:18px;z-index:9999;display:none;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:24px}
.ece-qbank h2{margin-top:0}.ece-qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ece-qgrid select,.ece-qgrid input,.ece-qbank textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ddd;border-radius:8px}
.ece-qbank .qrow{border:1px solid #e5e5e5;border-radius:12px;padding:14px;margin:10px 0;background:#fafafa}
.ece-qbank .qactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ece-qbank button{padding:8px 12px;border:0;border-radius:8px;cursor:pointer}
.ece-qbank .primary{background:#2f7d32;color:#fff}.ece-qbank .danger{background:#b42318;color:#fff}
@media(max-width:900px){.ece-qgrid{grid-template-columns:1fr 1fr}}
</style>
<div id="eceQBankOverlay" class="ece-qbank-overlay" onclick="closeQuestionBank()"></div>
<section id="eceQuestionBank" class="ece-qbank" aria-label="Banque de questions">
  <h2>📝 Banque de questions ECE Formation</h2>
  <p>Ajoutez, modifiez ou supprimez les questions et leurs réponses directement depuis l'administration.</p>
  <div class="ece-qgrid">
    <select id="qbTraining"></select>
    <select id="qbModule"></select>
    <select id="qbDifficulty"><option>Débutant</option><option>Intermédiaire</option><option>Avancé</option></select>
    <input id="qbSearch" placeholder="Rechercher une question…">
  </div>
  <div class="qactions">
    <button class="primary" onclick="newQuestion()">＋ Nouvelle question</button>
    <button onclick="closeQuestionBank()">Fermer</button>
  </div>
  <div id="qbList"></div>
</section>
<script>
(function(){
  const KEY='ece_question_bank_v1';
  const trainings={
    "Word Débutant":["Découvrir l’environnement Word","Saisir et organiser le texte","Mettre en forme le texte","Imprimer un document simple"],
    "Word Intermédiaire":["Insertions et illustrations","Maîtriser les tableaux","Tabulations et organisation avancée","Mise en page et finitions"],
    "Word Avancé":["Styles avancés et charte graphique","Modèles et productivité","Documents longs et structurés","Publipostage et travail collaboratif"],
    "Excel Initiation":["Se repérer dans une feuille de calcul","Concevoir et présenter un tableau simple","Calculer avec Excel"],
    "Excel Perfectionnement":["Gérer les feuilles de calcul","Imprimer et paramétrer les impressions","Concevoir des graphiques simples","Utiliser les tris et filtres","Fonctions conditionnelles"],
    "Excel Expert":["Fonctions de base & méthodes de travail","Maîtriser les fonctions de recherche","Gérer des bases de données","Concevoir des tableaux croisés dynamiques","Graphiques avancés","Lier et sécuriser les données"]
  };
  const seed=[
    {id:"q-demo-1",training:"Word Débutant",module:0,difficulty:"Débutant",question:"Quel raccourci permet d’enregistrer un document ?",answers:["Ctrl + S","Ctrl + P","Ctrl + N","Ctrl + F"],correct:0}
  ];
  let bank=JSON.parse(localStorage.getItem(KEY)||"null")||seed;
  localStorage.setItem(KEY,JSON.stringify(bank));
  window.eceQuestionBank=bank;

  function fillTrainings(){
    const s=document.getElementById('qbTraining'); if(!s)return;
    s.innerHTML=Object.keys(trainings).map(t=>`<option>${t}</option>`).join('');
    s.onchange=fillModules; fillModules();
  }
  function fillModules(){
    const t=document.getElementById('qbTraining').value, s=document.getElementById('qbModule');
    s.innerHTML=(trainings[t]||[]).map((m,i)=>`<option value="${i}">Module ${i+1} — ${m}</option>`).join('');
    render();
  }
  function filtered(){
    const t=document.getElementById('qbTraining').value, m=+document.getElementById('qbModule').value;
    const d=document.getElementById('qbDifficulty').value, q=(document.getElementById('qbSearch').value||'').toLowerCase();
    return bank.filter(x=>x.training===t&&x.module===m&&(x.difficulty===d||!x.difficulty)&&x.question.toLowerCase().includes(q));
  }
  function render(){
    const box=document.getElementById('qbList'); if(!box)return;
    const rows=filtered();
    box.innerHTML=rows.length?rows.map(x=>`
      <div class="qrow" data-id="${x.id}">
        <strong>${escapeHtml(x.question)}</strong>
        <div>${x.answers.map((a,i)=>`<div>${i===x.correct?'✅':'○'} ${escapeHtml(a)}</div>`).join('')}</div>
        <div class="qactions">
          <button onclick="editQuestion('${x.id}')">✏️ Modifier</button>
          <button class="danger" onclick="deleteQuestion('${x.id}')">🗑️ Supprimer</button>
        </div>
      </div>`).join(''):'<p>Aucune question dans cette sélection.</p>';
  }
  function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function save(){localStorage.setItem(KEY,JSON.stringify(bank));window.eceQuestionBank=bank;render();}
  window.openQuestionBank=function(){
    document.getElementById('eceQBankOverlay').style.display='block';
    document.getElementById('eceQuestionBank').style.display='block'; fillTrainings();
  };
  window.closeQuestionBank=function(){document.getElementById('eceQBankOverlay').style.display='none';document.getElementById('eceQuestionBank').style.display='none';};
  window.newQuestion=function(){
    const t=document.getElementById('qbTraining').value,m=+document.getElementById('qbModule').value;
    const q={id:'q-'+Date.now(),training:t,module:m,difficulty:document.getElementById('qbDifficulty').value,question:"Nouvelle question",answers:["Réponse A","Réponse B","Réponse C","Réponse D"],correct:0};
    bank.push(q); save(); editQuestion(q.id);
  };
  window.editQuestion=function(id){
    const x=bank.find(q=>q.id===id); if(!x)return;
    const q=prompt("Question :",x.question); if(q===null)return; x.question=q;
    x.answers=x.answers.map((a,i)=>{const v=prompt("Réponse "+String.fromCharCode(65+i)+" :",a); return v===null?a:v;});
    const c=prompt("Numéro de la bonne réponse (1 à 4) :",String(x.correct+1));
    if(c!==null&&/^[1-4]$/.test(c))x.correct=+c-1;
    save();
  };
  window.deleteQuestion=function(id){
    if(!confirm("Supprimer cette question ?"))return;
    bank=bank.filter(q=>q.id!==id); save();
  };
  document.addEventListener('input',e=>{if(e.target.id==='qbSearch')render();});
  window.addEventListener('load',fillTrainings);
})();
</script>

</body></html>
